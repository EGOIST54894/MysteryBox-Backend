# Alembic 数据库迁移配置文件
# 用于管理数据库 schema 的版本控制和变更

[alembic]
# 迁移脚本存放目录
script_location = alembic

# 预处理迁移脚本的 SQL 输出文件的存放目录
# sqlalchemy.url 用于离线模式生成 SQL
# sql_output_dir = alembic_sql

# 数据库连接 URL
# 注意：在线模式下会从 env.py 中加载，此处作为备选
sqlalchemy.url = mysql+pymysql://root:123456@localhost:3306/mystery_box

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
